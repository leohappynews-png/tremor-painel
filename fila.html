/* Tremor, painel v1 (Olho, 15/11/2026). Base comum das 4 paginas. O construir.py injeta isto inline em cada pagina.
   Regra da marca: vermelho Abalo SO marca o tremor (nota acima da regua, pico do traco, prazo estourado). Nunca texto vermelho pequeno sobre a Tinta. */
:root {
  --tinta: #14202F; --papel: #EEF1EC; --abalo: #D0202C; --pena: #2B5C8E; --grafite: #56616B;
  --grade: #C3CEC9; --folha: #F7F8F5; --branco: #FFFFFF; --linha: #DDE3DF; --abalo-fundo: #FCE8E9; --abalo-texto: #9E1620;
  --pena-fundo: #E3ECF5; --lado-texto: #C6D0CB; --lado-apoio: #A9B5AF;
  --sans: "Archivo", "Segoe UI", system-ui, sans-serif;
  --serif: "Source Serif 4", Georgia, serif;
  --mono: "Martian Mono", Consolas, monospace;
  --raio: 10px; --raio-p: 6px;
  --lado-l: 232px; --topo-a: 56px; --nav-a: 64px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; font: 400 15px/1.5 var(--sans); color: var(--tinta); background: var(--papel);
  font-feature-settings: "lnum", "kern"; -webkit-font-smoothing: antialiased; min-height: 100vh;
}
h1, h2, h3, h4, p { margin: 0; }
a { color: var(--pena); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--pena); outline-offset: 2px; border-radius: 4px; }
.lado :focus-visible, .nav :focus-visible { outline-color: var(--papel); }
.so-leitor { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--mono); }
.serif { font-family: var(--serif); }
[hidden] { display: none !important; }

/* ---------- moldura: lado (computador) / topo + navegacao de baixo (celular) ---------- */
.app { display: flex; min-height: 100vh; background: linear-gradient(to right, var(--tinta) var(--lado-l), transparent var(--lado-l)); }
.lado {
  width: var(--lado-l); flex: none; background: var(--tinta); color: var(--lado-texto);
  padding: 22px 16px 18px; display: flex; flex-direction: column; gap: 4px;
  position: sticky; top: 0; height: 100vh;
}
.lado .logo { display: block; margin: 0 6px 26px; width: 128px; }
.lado .logo svg { display: block; width: 100%; height: auto; }
.lado nav a, .nav a {
  display: flex; align-items: center; gap: 11px; padding: 10px; border-radius: 7px; font-size: 14px;
  color: var(--lado-texto); text-decoration: none;
}
.lado nav a:hover { background: rgba(238,241,236,.06); color: #fff; }
.lado nav a[aria-current="page"] { background: rgba(238,241,236,.1); color: #fff; font-weight: 600; box-shadow: inset 3px 0 0 var(--papel); }
.lado nav { display: flex; flex-direction: column; gap: 4px; }
.lado .saude { margin-top: auto; border-top: 1px solid rgba(238,241,236,.14); padding: 14px 8px 0; font-size: 12.5px; color: var(--lado-apoio); line-height: 1.5; }
.lado .saude svg { display: block; width: 100%; height: 20px; margin: 6px 0 4px; }
.lado .saude b { color: #fff; font-weight: 600; }
.lado .saude .alarme { color: #fff; }
.lado .saude button { background: none; border: 0; padding: 0; color: #fff; text-decoration: underline; font-size: 12.5px; }
.lado .assin { margin-top: 14px; padding: 0 8px; display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--lado-apoio); }
.lado .assin img { height: 24px; width: auto; border-radius: 3px; }

.topo { display: none; }
.nav { display: none; }
.principal { flex: 1; min-width: 0; padding: 26px 34px 40px; }

/* ---------- cabecalho da pagina ---------- */
.cab { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.cab .trilha { font-size: 13px; color: var(--grafite); margin-bottom: 4px; }
.cab h1 { font-size: 30px; font-weight: 760; letter-spacing: -.02em; line-height: 1.1; }
.cab .acoes { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ---------- pecas ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 0 16px;
  border-radius: 8px; font: 600 14px var(--sans); border: 1px solid var(--tinta); background: var(--tinta); color: var(--papel);
  text-decoration: none; white-space: nowrap;
}
.btn:hover { background: #22324A; }
.btn.claro { background: transparent; color: var(--tinta); border-color: var(--grade); }
.btn.claro:hover { background: var(--folha); border-color: var(--grafite); }
.btn.pequeno { min-height: 34px; padding: 0 12px; font-size: 13px; }
.btn[disabled] { opacity: .55; cursor: default; }
.caixa { background: var(--folha); border: 1px solid var(--grade); border-radius: var(--raio); }
.bloco-t { font-size: 13.5px; font-weight: 700; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.bloco-t .apoio { font-weight: 500; color: var(--grafite); font-size: 13px; }
.pilula {
  display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 2px 10px; border-radius: 13px; font-size: 12.5px;
  border: 1px solid var(--grade); background: var(--branco); color: var(--tinta); white-space: nowrap;
}
.pilula.apagada { color: var(--grafite); background: transparent; }
.cod {
  font-family: var(--mono); font-size: 11.5px; font-weight: 600; display: inline-block; border: 1px solid var(--tinta);
  border-radius: 4px; padding: 1px 5px; line-height: 1.5; white-space: nowrap; color: var(--tinta);
}
.apoio { color: var(--grafite); }

/* chave liga/desliga: botao de verdade (role=switch), alvo de toque 44px */
.chave {
  position: relative; flex: none; width: 46px; height: 44px; border: 0; background: none; padding: 0; display: inline-flex; align-items: center; justify-content: center;
}
.chave::before { content: ""; width: 40px; height: 24px; border-radius: 12px; background: #AEBBB5; transition: background .15s; }
.chave::after {
  content: ""; position: absolute; top: 14px; left: 6px; width: 18px; height: 18px; border-radius: 50%; background: #fff;
  box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s;
}
.chave[aria-checked="true"]::before { background: var(--pena); }
.chave[aria-checked="true"]::after { transform: translateX(16px); }
.chave[aria-busy="true"] { opacity: .5; }

/* faixa do modo sombra: estado do sistema, sem alarme (nao e vermelho) */
.faixa {
  display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: var(--raio); margin-bottom: 18px;
  background-color: var(--folha); border: 1px solid var(--grade); font-size: 13.5px; line-height: 1.5;
  background-image: linear-gradient(to right, rgba(43,92,142,.07) 1px, transparent 1px), linear-gradient(to bottom, rgba(43,92,142,.07) 1px, transparent 1px);
  background-size: 8px 8px;
}
.faixa svg { flex: none; margin-top: 2px; }
.faixa b { font-weight: 700; }
.exemplo { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 4px; background: #FFF6D6; color: #5A4300; border: 1px solid #E7CF7A; font-size: 12px; font-weight: 600; }

/* abas de perfil (segmentado) */
.abas { display: inline-flex; gap: 4px; padding: 4px; background: var(--branco); border: 1px solid var(--grade); border-radius: 10px; flex-wrap: wrap; }
.abas button { border: 0; background: none; padding: 0 14px; min-height: 36px; border-radius: 7px; font-size: 14px; color: var(--grafite); font-weight: 500; }
.abas button[aria-pressed="true"] { background: var(--tinta); color: var(--papel); font-weight: 600; }
.abas button:not([aria-pressed="true"]):hover { color: var(--tinta); background: var(--papel); }

/* estados: carregando, vazio, erro */
.estado-tela { padding: 48px 20px; text-align: center; color: var(--grafite); font-size: 14.5px; max-width: 460px; margin: 0 auto; }
.estado-tela svg { display: block; margin: 0 auto 16px; width: 180px; height: 40px; }
.estado-tela h2 { font-size: 18px; color: var(--tinta); margin-bottom: 8px; }
.estado-tela p + p { margin-top: 8px; }
.vazio { font-size: 13.5px; color: var(--grafite); padding: 14px 10px; border: 1px dashed #A9B6B0; border-radius: 8px; text-align: center; }
.carregando { color: var(--grafite); font-size: 14px; padding: 24px 0; }

/* aviso curto depois de uma acao */
.aviso {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; z-index: 50; pointer-events: none;
  background: var(--tinta); color: var(--papel); padding: 11px 16px; border-radius: 8px; font-size: 14px; max-width: calc(100vw - 32px);
  box-shadow: 0 10px 30px -10px rgba(20,32,47,.6); transition: opacity .18s, transform .18s;
}
.aviso.ver { opacity: 1; transform: translate(-50%, 0); }
.aviso.erro { background: var(--abalo-texto); }

/* janela de formulario */
dialog.folha {
  border: 1px solid var(--grade); border-radius: 14px; padding: 0; width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 32px);
  background: var(--folha); color: var(--tinta); box-shadow: 0 30px 60px -20px rgba(20,32,47,.55);
}
dialog.folha::backdrop { background: rgba(20,32,47,.45); }
dialog.folha form { display: flex; flex-direction: column; max-height: calc(100vh - 34px); }
dialog.folha .f-cab { padding: 18px 22px 10px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
dialog.folha .f-cab h2 { font-size: 20px; font-weight: 720; letter-spacing: -.01em; }
dialog.folha .f-corpo { padding: 6px 22px 10px; overflow: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
dialog.folha .f-pe { padding: 14px 22px 18px; display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid var(--linha); }
.fechar { border: 0; background: none; width: 44px; height: 44px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: var(--grafite); }
.fechar:hover { background: var(--papel); color: var(--tinta); }
.campo { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 600; }
.campo.largo { grid-column: 1 / -1; }
.campo small { font-weight: 400; color: var(--grafite); font-size: 12.5px; line-height: 1.4; }
.campo input, .campo select {
  font-size: 16px; font-weight: 400; min-height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid #A9B6B0; background: var(--branco);
}
.campo input:focus, .campo select:focus { outline: 2px solid var(--pena); outline-offset: 0; border-color: var(--pena); }
.campo .erro-campo { color: var(--abalo-texto); font-weight: 600; font-size: 12.5px; }


/* pecas de lista usadas pelo Historico e pelo Telegram (16/11: sairam do painel.css) */
.filtros { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
.filtros button { min-height: 36px; padding: 0 13px; border-radius: 18px; border: 1px solid var(--grade); background: var(--branco); font-size: 13.5px; color: var(--tinta); }
.filtros button .n { font: 500 11.5px var(--mono); color: var(--grafite); margin-left: 4px; }
.filtros button[aria-pressed="true"] { background: var(--tinta); color: var(--papel); border-color: var(--tinta); }
.filtros button[aria-pressed="true"] .n { color: #C6D0CB; }
.lista { display: flex; flex-direction: column; gap: 10px; }
.frase-dia { margin-top: 12px; font-size: 14px; color: #2D3A47; line-height: 1.55; }
.frase-dia b { color: var(--tinta); }
.nao-trad { font-size: 11.5px; border: 1px dashed #A9B6B0; border-radius: 10px; padding: 0 7px; color: var(--grafite); }
.mais { margin-top: 14px; }

/* ---------- celular ---------- */
@media (max-width: 860px) {
  .lado { display: none; }
  .app { display: block; background: none; }
  .abas button { min-height: 40px; }
  .topo {
    display: flex; align-items: center; gap: 10px; height: var(--topo-a); padding: 0 16px; background: var(--tinta); color: var(--papel);
    position: sticky; top: 0; z-index: 20;
  }
  .topo .simbolo { width: 30px; height: 30px; flex: none; }
  .topo .nome { font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
  .topo .vao { flex: 1; }
  .topo .saude-curta { font-size: 12px; color: var(--lado-texto); display: flex; align-items: center; gap: 6px; }
  .topo .saude-curta i { width: 8px; height: 8px; border-radius: 50%; background: #7FA0C2; }
  .topo .saude-curta i.mal { background: var(--abalo); box-shadow: 0 0 0 2px rgba(208,32,44,.35); }
  .nav {
    display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--tinta); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); height: auto;
  }
  .nav a { flex-direction: column; gap: 3px; padding: 7px 2px; font-size: 11.5px; justify-content: center; text-align: center; min-height: 52px; }
  .nav a[aria-current="page"] { color: #fff; font-weight: 600; background: rgba(238,241,236,.1); }
  .principal { padding: 18px 16px calc(var(--nav-a) + 40px + env(safe-area-inset-bottom)); }
  .cab { margin-bottom: 16px; }
  .cab h1 { font-size: 25px; }
  .aviso { bottom: calc(var(--nav-a) + 18px); }
  dialog.folha .f-corpo { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* Fila de producao (tela 5 da proposta) */
.prazos { font-size: 13px; color: var(--grafite); max-width: 520px; text-align: right; line-height: 1.45; }
.prazos b { color: var(--tinta); font-weight: 600; }
/* Kanban: 6 etapas fixas, sempre visiveis. Nao cabe? rola para o lado com encaixe (como app). */
.quadro {
  position: relative;   /* texto so-leitor (absolute) dentro do quadro nao pode escapar e alargar a pagina */
  display: grid; grid-auto-flow: column; grid-template-columns: repeat(6, minmax(160px, 1fr)); gap: 12px; align-items: stretch;
  overflow-x: auto; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; padding-bottom: 8px; scrollbar-width: thin;
}
.quadro.com-previa { grid-template-columns: repeat(4, minmax(160px, 1fr)) minmax(280px, 1.7fr) minmax(160px, 1fr); }
.quadro:focus-visible { outline: 2px solid var(--pena); outline-offset: 4px; }
.coluna { background: rgba(195,206,201,.32); border-radius: var(--raio); padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 340px; scroll-snap-align: start; }
.col-cab { padding: 0 2px 6px; border-bottom: 1px solid rgba(91,102,112,.18); }
.coluna h2 { font-size: 13.5px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
.coluna h2 .passo { font: 600 10.5px/18px var(--mono); width: 18px; height: 18px; text-align: center; border-radius: 50%; border: 1px solid #8C9792; color: var(--grafite); flex: none; }
.coluna h2 .n { margin-left: auto; font: 600 12px var(--mono); color: var(--grafite); }
.coluna:not(.vazia) h2 .n { color: var(--tinta); }
.col-meta { font-size: 12px; color: var(--grafite); margin-top: 3px; line-height: 1.35; }
.col-meta b { color: var(--tinta); font-weight: 600; }
.col-vazia { font-size: 12.5px; color: var(--grafite); padding: 12px 6px; border-top: 1.5px dashed #A9B6B0; text-align: center; margin-top: 4px; }
.faixa-fila { margin-bottom: 14px; align-items: center; }
.faixa-fila a { font-weight: 600; white-space: nowrap; }
.dica-arrastar { display: none; }
.card { background: var(--branco); border: 1px solid var(--grade); border-radius: 9px; padding: 12px; scroll-margin-top: 80px; }
.card:target { box-shadow: 0 0 0 2px var(--pena); }
.card .c-tit { font-family: var(--serif); font-weight: 600; font-size: 15.5px; line-height: 1.28; margin: 8px 0 6px; overflow-wrap: anywhere; }
.card .meta { font-size: 12.5px; color: var(--grafite); line-height: 1.45; }
.relogio { display: inline-block; line-height: 1.5; font: 500 12.5px/1.5 var(--sans); color: var(--tinta); background: var(--pena-fundo); border-radius: 4px; padding: 3px 7px; margin-top: 8px; }
.relogio svg { vertical-align: -1px; margin-right: 4px; }
.relogio b { font: 600 11.5px var(--mono); white-space: nowrap; }
.relogio.estourou { background: var(--abalo-fundo); color: var(--abalo-texto); }
.selo { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 4px; background: #E3E9E6; color: var(--tinta); margin-top: 8px; }
.selo.espera { background: var(--abalo-fundo); color: var(--abalo-texto); }
.grande { border: 1.5px solid var(--tinta); padding: 14px; }
.topo-g { display: grid; grid-template-columns: 96px 1fr; gap: 14px; }
.topo-g.sem-capa { grid-template-columns: 1fr; }
.thumb { width: 96px; height: 170px; border-radius: 6px; overflow: hidden; position: relative; background: var(--tinta); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb span { position: absolute; right: 5px; bottom: 5px; font: 500 10.5px var(--mono); color: #fff; background: rgba(0,0,0,.65); padding: 1px 4px; border-radius: 3px; }
.grande .c-tit { font-size: 17px; }
.etapas { list-style: none; margin: 12px 0 0; padding: 0; }
.etapas li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 7px 0; border-top: 1px solid var(--linha); font-size: 13px; line-height: 1.4; }
.etapas li b { font-weight: 650; }
.etapas li span { color: var(--grafite); }
.ok { width: 18px; height: 18px; border-radius: 50%; background: var(--tinta); display: flex; align-items: center; justify-content: center; margin-top: 1px; }
.esp { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--abalo); margin-top: 1px; position: relative; }
.esp::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--abalo); }
.falta { width: 18px; height: 18px; border-radius: 50%; border: 1.5px dashed #A9B6B0; margin-top: 1px; }
.grande .btn { margin-top: 12px; width: 100%; }
.rodape-fila { font-size: 13px; color: var(--grafite); margin-top: 16px; }
.fora { margin-top: 18px; }
.fora summary { list-style: none; cursor: pointer; font-size: 14px; font-weight: 600; min-height: 40px; display: flex; align-items: center; gap: 8px; }
.fora summary::-webkit-details-marker { display: none; }
.fora summary svg { transition: transform .15s; }
.fora[open] summary svg { transform: rotate(90deg); }
.fora ul { list-style: none; margin: 6px 0 0; padding: 0; }
.fora li { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--linha); font-size: 13.5px; }
.fora li .t { font-family: var(--serif); font-weight: 600; }
.fora li .q { color: var(--grafite); font-size: 12.5px; white-space: nowrap; }

@media (max-width: 860px) {
  .prazos { text-align: left; }
  /* celular: uma coluna por tela, a seguinte aparecendo na beirada (convida a arrastar) */
  .quadro, .quadro.com-previa { grid-template-columns: none; grid-auto-columns: 84%; gap: 10px; margin: 0 -16px; padding: 0 16px 10px; scroll-padding: 0 16px; }
  .quadro, .quadro.com-previa { align-items: start; }
  .coluna { min-height: 300px; }
  .dica-arrastar { display: block; font-size: 12.5px; color: var(--grafite); margin: 0 0 8px; }
  .fora li { grid-template-columns: auto 1fr; }
  .fora li .q { grid-column: 2; }
}

<script>
/* Tremor, painel v2: base comum (Olho, 15/11/2026). Contrato da API: ../API-CONTRATO.md
   Paginas estaticas (GitHub Pages); a API mora no n8n, em outra origem (CORS).
   A chave NUNCA esta no HTML: chega no link (#k= ou ?k=), vai para o localStorage (tremor_chave) e some da barra de endereco.
   Nada aqui pode lancar erro no carregamento: se T nao nascer, a pagina inteira morre ("T is not defined", 15/11). */
"use strict";
const T = (() => {
  const API = "https://n8n.srv1031906.hstgr.cloud/webhook/tremor/api";                       // constante unica: vem do construir.py (API_TREMOR)
  const GUARDA = "tremor_chave";
  const origemOpaca = (() => { try { return self.origin === "null" || location.origin === "null"; } catch (e) { return true; } })();

  // guarda da chave: localStorage quando da; se o navegador bloquear, fica so na memoria desta aba
  let memoria = "";
  function lerGuarda() { try { return localStorage.getItem(GUARDA) || memoria; } catch (e) { return memoria; } }
  function gravarGuarda(k) { memoria = k; try { localStorage.setItem(GUARDA, k); } catch (e) { /* bloqueado: segue em memoria */ } }
  function apagarGuarda() { memoria = ""; try { localStorage.removeItem(GUARDA); } catch (e) { } }

  // 1) chave: do link para a guarda, e tira do endereco (nao fica no historico, em print, nem no Referer)
  const chave = (() => {
    try {
      const u = new URL(location.href);
      const h = new URLSearchParams(u.hash.replace(/^#/, ""));
      const k = h.get("k") || u.searchParams.get("k");
      if (h.has("k") || u.searchParams.has("k")) {
        h.delete("k"); u.searchParams.delete("k");
        const resto = h.toString();
        try { history.replaceState(null, "", u.pathname + (u.searchParams.toString() ? "?" + u.searchParams : "") + (resto ? "#" + resto : "")); } catch (e) { }
        if (k && /^[A-Za-z0-9_-]{16,128}$/.test(k)) { gravarGuarda(k); return k; }
      }
    } catch (e) { }
    return lerGuarda();
  })();

  class SemChave extends Error {}

  async function pedir(url, opcoes) {
    if (!chave) throw new SemChave();
    let resp;
    try {
      resp = await fetch(url, Object.assign({ mode: "cors", credentials: "omit", cache: "no-store", referrerPolicy: "no-referrer" }, opcoes,
        { headers: Object.assign({ "X-Tremor-Chave": chave, "Accept": "application/json" }, (opcoes || {}).headers) }));
    } catch (e) { throw new Error("Sem conexão com o servidor do Tremor. Confira a internet e tente de novo."); }
    let corpo = null;
    try { corpo = await resp.json(); } catch (e) { /* corpo vazio ou HTML */ }
    if (resp.status === 401 || (corpo && corpo.ok === false && corpo.motivo === "chave")) { apagarGuarda(); throw new SemChave(); }
    if (!resp.ok || !corpo || corpo.ok === false) {
      const m = corpo && corpo.mensagem ? corpo.mensagem : `O servidor respondeu ${resp.status}${corpo && corpo.motivo ? " (" + corpo.motivo + ")" : ""}.`;
      const e = new Error(m); e.motivo = corpo && corpo.motivo; e.campo = corpo && corpo.campo; throw e;
    }
    return corpo;
  }
  const ler = (r, params) => {
    const q = new URLSearchParams(Object.assign({ r }, params || {}));
    return pedir(`${API}?${q}`);
  };
  const agir = (op, dados) => pedir(API, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.assign({ op }, dados || {}))
  });

  // ---------- formatos (fuso do painel; padrao Dublin) ----------
  let fuso = "Europe/Dublin";
  const fmt = (o) => new Intl.DateTimeFormat("pt-BR", Object.assign({ timeZone: fuso }, o));
  function hora(iso) { if (!iso) return "–"; const p = fmt({ hour: "2-digit", minute: "2-digit", hour12: false }).formatToParts(new Date(iso)); return `${val(p, "hour")}h${val(p, "minute")}`; }
  function dia(iso) { if (!iso) return "–"; return fmt({ day: "2-digit", month: "2-digit" }).format(new Date(iso)); }
  function diaLongo(d) { return fmt({ weekday: "long", day: "numeric", month: "long" }).format(d); }
  function diaISO(d) { const p = fmt({ year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(d); return `${val(p, "year")}-${val(p, "month")}-${val(p, "day")}`; }
  function val(p, t) { const x = p.find(z => z.type === t); return x ? x.value : ""; }
  function minutosDesde(iso, agora) { return Math.round(((agora || Date.now()) - new Date(iso).getTime()) / 60000); }
  function haQuanto(iso, agora) {
    const m = minutosDesde(iso, agora);
    if (m < 1) return "agora"; if (m < 60) return `há ${m} min`;
    const h = Math.floor(m / 60); if (h < 24) return `há ${h} h${m % 60 ? " " + (m % 60) + " min" : ""}`;
    return `há ${Math.floor(h / 24)} d`;
  }
  function duracao(min) { if (min < 60) return `${min} min`; const h = Math.floor(min / 60), r = min % 60; return r ? `${h} h ${r} min` : `${h} h`; }
  const num = (n) => new Intl.NumberFormat("pt-BR").format(n);
  const dec = (n, c) => new Intl.NumberFormat("pt-BR", { minimumFractionDigits: c, maximumFractionDigits: c }).format(n);
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  // titulo em pt-BR (API v1.9): "titulo" ja traduzido + "titulo_original". Sem original = a IA nao classificou/traduziu.
  // Devolve { traduzido, original }: original so quando difere do traduzido (ignora caixa e espacos).
  function traducao(h) {
    const orig = h.titulo_original;
    if (orig == null || String(orig).trim() === "") return { traduzido: false, original: "" };
    const igual = String(orig).trim().toLowerCase().replace(/\s+/g, " ") === String(h.titulo || "").trim().toLowerCase().replace(/\s+/g, " ");
    return { traduzido: true, original: igual ? "" : String(orig).trim() };
  }
  function urlSegura(u) { try { const x = new URL(u); return (x.protocol === "https:" || x.protocol === "http:") ? x.href : ""; } catch (e) { return ""; } }

  // ---------- o traco do sismografo, com dado de verdade ----------
  // valores: numeros >= 0 (um por fatia de tempo). abalo: booleanos (fatia que treme = vermelho). Deterministico pela semente.
  function rnd(seed) { let s = seed >>> 0 || 1; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
  function traco(valores, o) {
    o = Object.assign({ w: 200, h: 30, y: 15, amp: 12, semente: 7, passo: 2.6, abalo: [], max: null, fim: null, calma: "#2B5C8E", cor: "#D0202C", esp: 1.3, base: 0.05, x0: 0 }, o);
    const n = valores.length; if (!n) return "";
    const max = o.max || Math.max(1, ...valores), min = o.min != null ? o.min : 0;
    const r = rnd(o.semente);
    const larg = o.fim == null ? o.w - o.x0 : o.fim - o.x0;
    const fatia = larg / n;
    const segs = []; let atual = null;
    for (let x = o.x0; x <= o.x0 + larg + 0.01; x += o.passo) {
      const i = Math.min(n - 1, Math.floor((x - o.x0) / fatia));
      const v = Math.max(0, Math.min(1, (valores[i] - min) / Math.max(1, max - min)));
      const treme = !!o.abalo[i];
      const a = (treme ? 0.55 + 0.45 * v : o.base + 0.42 * Math.pow(v, 1.4)) * o.amp;   // calma quase reta; so o abalo vai longe
      const yy = o.y + (r() < 0.5 ? -1 : 1) * a * (0.35 + r() * 0.65);
      const modo = treme ? "abalo" : "calma";
      if (!atual || atual.modo !== modo) { const ult = atual ? atual.pts[atual.pts.length - 1] : null; atual = { modo, pts: ult ? [ult] : [] }; segs.push(atual); }
      atual.pts.push([x, yy]);
    }
    return segs.filter(s => s.pts.length > 1).map(s =>
      `<path d="M${s.pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L")}" fill="none" stroke="${s.modo === "abalo" ? o.cor : o.calma}" stroke-width="${s.modo === "abalo" ? o.esp * 1.15 : o.esp}" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`
    ).join("");
  }
  function sementeDe(t) { let h = 2166136261; for (const c of String(t)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

  // ---------- aviso curto ----------
  let tAviso;
  function aviso(txt, erro) {
    let el = document.getElementById("aviso");
    if (!el) { el = document.createElement("div"); el.id = "aviso"; el.className = "aviso"; el.setAttribute("role", "status"); el.setAttribute("aria-live", "polite"); document.body.append(el); }
    el.textContent = txt; el.classList.toggle("erro", !!erro); el.classList.add("ver");
    clearTimeout(tAviso); tAviso = setTimeout(() => el.classList.remove("ver"), erro ? 6000 : 3200);
  }

  // ---------- telas de estado ----------
  const linhaCalma = `<svg viewBox="0 0 180 40" aria-hidden="true">${traco(new Array(30).fill(1), { w: 180, h: 40, y: 20, amp: 4, semente: 5 })}</svg>`;
  function telaSemChave(alvo) {
    alvo.innerHTML = `<div class="estado-tela">${linhaCalma}<h2>Este link não abre o painel</h2>
      <p>O painel só abre pelo link com a chave, que chega no seu e-mail pelo vigia do Tremor.</p>
      <p>Abra o link do e-mail neste aparelho. Depois disso ele fica lembrado aqui e você entra direto.</p></div>`;
  }
  function telaErro(alvo, e, tentar) {
    alvo.innerHTML = `<div class="estado-tela">${linhaCalma}<h2>Não consegui ler o registro</h2><p>${esc(e.message)}</p>
      <p><button class="btn claro" type="button" data-tentar>Tentar de novo</button></p></div>`;
    alvo.querySelector("[data-tentar]").onclick = tentar;
  }

  // ---------- moldura: saude das fontes, modo, selo de exemplo ----------
  let resumo = null;
  async function moldura() {
    resumo = await ler("resumo");
    if (resumo.fuso) fuso = resumo.fuso;
    const s = resumo.saude || {};
    const falhas = (s.fontes_ativas || 0) - (s.fontes_ok || 0);
    const atraso = s.ultima_coleta_em ? minutosDesde(s.ultima_coleta_em, Date.parse(resumo.agora) || Date.now()) : null;
    const coletaParada = atraso == null || atraso > 70;     // a coleta roda de 30 em 30 min
    const mal = coletaParada || (s.alarmes_nao_lidos || 0) > 0;
    const el = document.getElementById("saude");
    if (el) {
      const valores = Array.from({ length: 40 }, () => 1);
      el.innerHTML = `Saúde das fontes
        <svg viewBox="0 0 200 20" preserveAspectRatio="none" aria-hidden="true">${traco(valores, { w: 200, h: 20, y: 10, amp: 3, semente: 3, calma: "#7FA0C2", abalo: valores.map((_, i) => mal && i > 30), cor: "#F26B74" })}</svg>
        última leitura <b>${s.ultima_coleta_em ? hora(s.ultima_coleta_em) : "nenhuma"}</b>${atraso != null ? ` (${haQuanto(s.ultima_coleta_em, Date.parse(resumo.agora))})` : ""}<br>
        ${num(s.fontes_ok || 0)} de ${num(s.fontes_ativas || 0)} fontes respondendo${falhas > 0 ? `, ${falhas} com falha` : ""}
        ${s.alarmes_nao_lidos ? `<br><span class="alarme">${s.alarmes_nao_lidos} alarme${s.alarmes_nao_lidos > 1 ? "s" : ""} do vigia</span> · <button type="button" id="ler-alarmes">marcar como lidos</button>` : ""}`;
      const b = document.getElementById("ler-alarmes");
      if (b) b.onclick = async () => { try { await agir("alarmes_lidos"); aviso("Alarmes marcados como lidos."); moldura(); } catch (e) { aviso(e.message, true); } };
    }
    const curta = document.getElementById("saude-curta");
    if (curta) curta.innerHTML = `<i class="${mal ? "mal" : ""}"></i>${s.ultima_coleta_em ? "leitura " + hora(s.ultima_coleta_em) : "sem leitura"}`;
    if (curta) curta.setAttribute("aria-label", mal ? "Atenção na coleta das fontes" : "Coleta das fontes em dia");
    const fx = document.getElementById("faixa-modo");
    if (fx && resumo.config) {
      const sombra = resumo.config.modo !== "envio" || resumo.config.envio_ligado !== "sim";
      fx.hidden = !sombra;
      if (sombra) fx.innerHTML = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B5C8E" stroke-width="1.8" aria-hidden="true"><path d="M2 12h5l2-4 3 8 2-6 1.5 2H22"/></svg>
        <div><b>Modo sombra.</b> O Tremor registra os alertas que teria mandado, mas nada vai para o WhatsApp. Marque o que você teria querido receber: é assim que a régua se ajusta.</div>`;
    }
    if (resumo.exemplo) document.querySelectorAll("[data-exemplo]").forEach(x => { x.hidden = false; });
    return resumo;
  }

  // inicia a pagina: moldura + conteudo; sem chave ou com erro, mostra a tela certa
  async function iniciar(carregar) {
    const alvo = document.getElementById("conteudo");
    const tentar = () => iniciar(carregar);
    if (origemOpaca) {   // pagina aberta num ambiente sem origem (ex.: CSP sandbox do n8n): sem guarda nem API, avisa em vez de travar
      alvo.innerHTML = `<div class="estado-tela">${linhaCalma}<h2>O painel abriu num endereço bloqueado</h2><p>Este endereço não deixa o painel guardar a chave nem falar com o servidor. Abra pelo link oficial do painel.</p></div>`;
      return;
    }
    try {
      alvo.setAttribute("aria-busy", "true");
      const r = await moldura();
      await carregar(r);
    } catch (e) {
      if (e instanceof SemChave) telaSemChave(alvo); else telaErro(alvo, e, tentar);
    } finally { alvo.removeAttribute("aria-busy"); }
  }

  // perfil escolhido: lembrado por pagina (conveniencia, nao estado)
  function perfilLembrado(perfis) {
    const u = new URLSearchParams(location.search).get("perfil");
    let id = u ? +u : 0;
    if (!id) { try { id = +localStorage.getItem("tremor_perfil") || 0; } catch (e) { } }
    const ok = perfis.find(p => p.id === id) || perfis.find(p => p.ativo) || perfis[0];
    return ok ? ok.id : null;
  }
  function lembrarPerfil(id) { try { localStorage.setItem("tremor_perfil", String(id)); } catch (e) { } }
  function abasPerfis(el, perfis, atual, aoTrocar) {
    el.innerHTML = perfis.map(p => `<button type="button" aria-pressed="${p.id === atual}" data-id="${p.id}">${esc(nomeCurto(p.nome))}${p.ativo ? "" : " (desligado)"}</button>`).join("");
    el.onclick = (ev) => { const b = ev.target.closest("button[data-id]"); if (!b) return; el.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); lembrarPerfil(+b.dataset.id); aoTrocar(+b.dataset.id); };
  }
  // "Irlanda (PT-BR, herda UE e Europa)" -> "Irlanda": o resto ja aparece nas pilulas
  function nomeCurto(n) { return String(n).replace(/\s*\(.*\)\s*$/, "") || n; }

  return { ler, agir, iniciar, aviso, esc, urlSegura, traducao, hora, dia, diaLongo, diaISO, haQuanto, minutosDesde, duracao, num, dec, traco, sementeDe,
    perfilLembrado, lembrarPerfil, abasPerfis, nomeCurto, get resumo() { return resumo; }, get fuso() { return fuso; } };
})();

</script>
<script>
if (typeof T === "undefined") {
  document.getElementById("conteudo").innerHTML = '<div class="estado-tela"><h2>O painel não carregou</h2><p>Recarregue a página. Se continuar, avise o time: a base do painel falhou ao abrir.</p></div>';
} else {
/* Fila de producao. API: r=fila; op producao_publicada. */
"use strict";
(() => {
  const E = T.esc;
  // As 6 etapas do contrato (tela 5 da proposta), SEMPRE visiveis: o quadro e o mapa do caminho, mesmo vazio.
  // prazo: chave em d.prazos (minutos) ou texto fixo. Revisao e do Sir: sem prazo.
  const COLUNAS = [
    { k: "aprovada", t: "Aprovada", dono: "Tremor", prazo: "segue sozinha", st: ["aprovada", "aprovada_checagem"] },
    { k: "checagem", t: "Checagem", dono: "Lívia", prazo: "checagem_min", st: ["checagem"] },
    { k: "roteiro", t: "Roteiro e legenda", dono: "Renata", prazo: "roteiro_min", st: ["roteiro", "devolvida"] },
    { k: "edicao", t: "Edição", dono: "Nanda", prazo: "edicao_min", st: ["edicao"] },
    { k: "revisao", t: "Revisão", dono: "Você", prazo: "sem prazo", st: ["revisao"] },
    { k: "publicada", t: "Publicada", dono: "Você posta", prazo: "inclui as checadas", st: ["publicada", "checada"] }
  ];
  const FORA = { ignorada: "você ignorou", expirada: "expirou sem resposta (48 h)", inconclusiva: "checagem inconclusiva: parou", arquivada: "arquivada" };
  const VEREDITO = { verdadeiro: "Verdadeiro", falso: "Falso", enganoso: "Enganoso", inconclusivo: "Inconclusivo" };
  const QUEM = { livia: "Lívia", renata: "Renata", nanda: "Nanda", claudinho: "Claudinho" };
  let d = null, agora = Date.now();

  T.iniciar(async (resumo) => { agora = Date.parse(resumo.agora) || Date.now(); await carregar(); });

  async function carregar() {
    d = await T.ler("fila");
    const pz = d.prazos || {};
    document.getElementById("prazos").textContent = pz.medidos ? "Prazos medidos nas últimas peças." : "Prazos são metas, ainda não medidas.";
    if (d.plano) document.getElementById("trilha").textContent = `Plano ${d.plano}`;
    desenhar();
  }

  function prazoTxt(c) {
    const pz = d.prazos || {};
    if (/_min$/.test(c.prazo)) return `prazo <b>${T.duracao(pz[c.prazo] || ({ checagem_min: 30, roteiro_min: 120, edicao_min: 360 })[c.prazo])}</b>`;
    return E(c.prazo);
  }

  function desenhar() {
    const alvo = document.getElementById("conteudo");
    const itens = d.itens || [];
    const cols = COLUNAS.map(c => ({ c, its: itens.filter(i => c.st.includes(i.status)).sort((a, b) => new Date(a.atualizado_em) - new Date(b.atualizado_em)) }));
    const fora = itens.filter(i => FORA[i.status]).sort((a, b) => new Date(b.atualizado_em) - new Date(a.atualizado_em));
    const andando = cols.slice(0, 5).reduce((n, x) => n + x.its.length, 0);
    const temPrevia = cols[4].its.length > 0;
    alvo.innerHTML = `
    ${andando ? "" : `<div class="faixa faixa-fila"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B5C8E" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="11" rx="1"/><rect x="17" y="4" width="4" height="7" rx="1"/></svg>
      <div><b>Nenhuma peça andando agora.</b> Quando você escolher "Fazer vídeo" ou "Só checar" num alerta, a história entra em Aprovada e anda sozinha pelas etapas. <a href="painel.html">Ver o histórico</a></div></div>`}
    <p class="dica-arrastar" aria-hidden="true">Arraste para o lado para ver as 6 etapas</p>
    <div class="quadro${temPrevia ? " com-previa" : ""}" tabindex="0" role="region" aria-label="Quadro da fila de produção, 6 etapas">
      ${cols.map(({ c, its }, n) => `<section class="coluna${its.length ? "" : " vazia"}" data-col="${c.k}" aria-labelledby="col-${c.k}">
        <header class="col-cab">
          <h2 id="col-${c.k}"><span class="passo">${n + 1}</span>${c.t}<span class="n" aria-label="${its.length} ${its.length === 1 ? "peça" : "peças"}">${its.length}</span></h2>
          <p class="col-meta">${E(c.dono)} · ${prazoTxt(c)}</p>
        </header>
        ${its.length ? its.map(i => i.status === "revisao" ? grande(i) : cartao(i)).join("") : `<div class="col-vazia">nada aqui</div>`}
      </section>`).join("")}
    </div>
    <p class="rodape-fila">Ninguém publica nem envia nada sozinho: aprovar a pauta e aprovar o vídeo são sempre seus.</p>
    ${fora.length ? `<details class="fora"><summary><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>Fora da fila (${fora.length})</summary><ul>${fora.map(i => `<li><span class="cod">${E(i.codigo)}</span><span class="t">${E(i.titulo)}</span><span class="q">${E(FORA[i.status])}, ${T.dia(i.atualizado_em)}</span></li>`).join("")}</ul></details>` : ""}`;
    alvo.onclick = publicar;
    if (location.hash) { const el = document.querySelector(location.hash); if (el) el.scrollIntoView({ block: "center", inline: "start" }); }
  }

  function entrou(i) {
    const ev = (i.eventos || []).filter(e => e.para === i.status).pop();
    return ev ? ev.em : i.atualizado_em;
  }
  function relogio(i) {
    if (!i.sla_ate || !["checagem", "roteiro", "edicao"].includes(i.status)) return "";
    const falta = Math.round((new Date(i.sla_ate) - agora) / 60000);
    const icone = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`;
    return falta >= 0 ? `<span class="relogio">${icone}prazo em <b>${T.duracao(falta)}</b></span>` : `<span class="relogio estourou">${icone}prazo estourou há <b>${T.duracao(-falta)}</b></span>`;
  }
  function metaTxt(i) {
    const partes = [i.ramo === "checar" ? "Só checar" : "Vídeo"];
    if (i.status === "aprovada" || i.status === "aprovada_checagem") partes.push("esperando a checagem começar");
    else if (i.dono_etapa) partes.push("com " + (QUEM[i.dono_etapa] || i.dono_etapa));
    if (i.status === "devolvida") partes.push(`devolvida para ajuste (${i.voltas} de 2)`);
    return `${partes.join(" · ")}<br>entrou ${T.haQuanto(entrou(i), agora)}`;
  }
  function cartao(i) {
    const pronto = i.status === "publicada" || i.status === "checada";
    return `<article class="card" id="p-${i.id}">
      <span class="cod">${E(i.codigo)}</span>
      <h3 class="c-tit">${E(i.titulo)}</h3>
      <div class="meta">${pronto ? `${i.ramo === "checar" ? "Só checar" : "Vídeo"} · ${i.status === "publicada" ? "publicada" : "checada"} ${T.dia(entrou(i))}` : metaTxt(i)}</div>
      ${i.veredito ? `<span class="selo">${E(VEREDITO[i.veredito] || i.veredito)}</span>` : ""}
      ${relogio(i)}
    </article>`;
  }
  function grande(i) {
    const p = i.peca || {};
    const capa = p.capa_url && (/^data:image\/(jpeg|png|webp);base64,/.test(p.capa_url) ? p.capa_url : T.urlSegura(p.capa_url));
    const feito = (para) => (i.eventos || []).find(e => e.para === para);
    const resumoDe = (k) => ((p.etapas || []).find(e => e.etapa === k) || {}).resumo;
    const passos = [["checagem", "Checagem"], ["roteiro", "Roteiro e legenda"], ["edicao", "Edição"]];
    const linhas = passos.map(([k, t]) => {
      const ev = feito(k); const rs = resumoDe(k);
      return `<li>${ev ? `<span class="ok" aria-hidden="true"><svg width="10" height="10" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="#fff" stroke-width="3.4"/></svg></span>` : `<span class="falta" aria-hidden="true"></span>`}
        <div><b>${t}:</b> <span>${rs ? E(rs) : ev ? "feita " + T.haQuanto(ev.em, agora) : "sem registro"}</span><span class="so-leitor">${ev ? " (feita)" : " (sem registro)"}</span></div></li>`;
    }).join("");
    const ajustes = `ajustes usados ${i.voltas || 0} de 2`;
    return `<article class="card grande" id="p-${i.id}">
      <div class="topo-g${capa ? "" : " sem-capa"}">
        ${capa ? `<div class="thumb"><img src="${E(capa)}" alt="Capa da prévia de ${E(i.codigo)}" loading="lazy">${p.duracao_s ? `<span>${Math.floor(p.duracao_s / 60)}:${String(Math.round(p.duracao_s % 60)).padStart(2, "0")}</span>` : ""}</div>` : ""}
        <div><span class="cod">${E(i.codigo)}</span><h3 class="c-tit">${E(p.titulo_peca || i.titulo)}</h3>
          ${p.nota ? `<div class="meta">${E(p.nota)}</div>` : ""}
          <span class="selo espera">aguardando você</span></div>
      </div>
      <ul class="etapas">${linhas}
        <li><span class="esp" aria-hidden="true"></span><div><b>Prévia:</b> <span>enviada ${T.haQuanto(entrou(i), agora)} · aguardando você · ${ajustes}</span></div></li>
      </ul>
      <button class="btn claro" type="button" data-publicar="${i.id}">Já publiquei esta peça</button>
    </article>`;
  }

  async function publicar(ev) {
    const b = ev.target.closest("[data-publicar]"); if (!b) return;
    const i = d.itens.find(x => x.id === +b.dataset.publicar);
    if (!confirm(`Marcar ${i.codigo} como publicada? Use depois de postar no Instagram.`)) return;
    b.disabled = true; b.textContent = "Marcando…";
    try {
      await T.agir("producao_publicada", { producao_id: i.id });
      i.status = "publicada"; i.atualizado_em = new Date(agora).toISOString();
      (i.eventos = i.eventos || []).push({ em: i.atualizado_em, quem: "sir", de: "revisao", para: "publicada" });
      T.aviso(`${i.codigo} marcada como publicada.`); desenhar();
    } catch (e) { b.disabled = false; b.textContent = "Já publiquei esta peça"; T.aviso(`Não marcou: ${e.message}`, true); }
  }
})();

}
</script>
</body>
